name: CI

# Ejecuta las pruebas del backend con una base de datos MySQL real.
# Sin base de datos, 91 de las 132 pruebas se saltan y la cobertura
# reportada cae a 7%, un numero que no refleja el estado del proyecto.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest + cobertura)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: globde_ci
          MYSQL_DATABASE: globde
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pglobde_ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=60s

    env:
      # La app lee estas variables via app/core/config.py.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: globde_ci
      DB_NAME: globde
      # Credenciales de usar y tirar: valen solo dentro de este job efimero.
      JWT_SECRET: ci_secret_no_produccion_solo_pruebas
      JWT_ALGORITHM: HS256
      APP_ENV: testing
      EMAIL_ENABLED: "false"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar Python 3.13
        run: uv python install 3.13

      - name: Instalar dependencias del backend
        working-directory: backend
        run: uv sync --group dev --frozen

      - name: Esperar a que MySQL acepte conexiones
        run: |
          for i in $(seq 1 60); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" --silent 2>/dev/null; then
              echo "MySQL respondio en el intento $i."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondio tras 120 segundos." >&2
          exit 1

      - name: Crear el esquema con Alembic
        working-directory: backend
        run: |
          # La base se construye con las migraciones, no con database.sql.
          # Asi cada push comprueba que las migraciones siguen siendo la
          # fuente de verdad del esquema.
          uv run alembic upgrade head
          uv run alembic current

      - name: Comprobar que las migraciones son reversibles
        working-directory: backend
        run: |
          # Un downgrade roto solo se descubre el dia que hay que revertir
          # en produccion. Mejor descubrirlo aqui.
          uv run alembic downgrade base
          restantes=$(mysql -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='$DB_NAME' AND table_name <> 'alembic_version';")
          if [ "$restantes" -ne 0 ]; then
            echo "El downgrade dejo $restantes objetos sin borrar." >&2
            exit 1
          fi
          uv run alembic upgrade head

      - name: Verificar esquema y datos semilla
        run: |
          # Sin las semillas, los tests de integracion se saltan en silencio
          # y la cobertura vuelve a caer a 7%.
          tablas=$(mysql -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='$DB_NAME' AND table_name <> 'alembic_version';")
          echo "Tablas y vistas creadas: $tablas"
          if [ "$tablas" -lt 20 ]; then
            echo "Se esperaban al menos 20 objetos en '$DB_NAME'." >&2
            exit 1
          fi
          usuarios=$(mysql -h 127.0.0.1 -P 3306 -uroot -p"$DB_PASSWORD" -N -B -e \
            "SELECT COUNT(*) FROM $DB_NAME.usuarios;")
          echo "Usuarios semilla: $usuarios"
          if [ "$usuarios" -lt 6 ]; then
            echo "Faltan datos semilla: se esperaban 6 usuarios." >&2
            exit 1
          fi

      - name: Ejecutar pruebas con cobertura
        working-directory: backend
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=resultados-pytest.xml

      - name: Fallar si alguna prueba se salto
        # Una prueba saltada casi siempre significa que la base de datos no
        # estaba lista. Sin este control el CI pasaria en verde con 41 de 132.
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          raiz = ET.parse("resultados-pytest.xml").getroot()
          suite = raiz if raiz.tag == "testsuite" else raiz.find("testsuite")
          total = int(suite.get("tests", 0))
          saltadas = int(suite.get("skipped", 0))
          print(f"Pruebas ejecutadas: {total} | saltadas: {saltadas}")
          if saltadas:
              print("Hubo pruebas saltadas: revisa la conexion a MySQL.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publicar resumen de cobertura
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          raiz = ET.parse("coverage.xml").getroot()
          pct = float(raiz.get("line-rate", 0)) * 100
          filas = []
          for paquete in raiz.iter("class"):
              # 'filename' es relativo a <source>, o sea a backend/app.
              archivo = paquete.get("filename", "")
              if not archivo.startswith("services/"):
                  continue
              filas.append((float(paquete.get("line-rate", 0)) * 100, archivo))
          filas.sort()
          resumen = os.environ.get("GITHUB_STEP_SUMMARY")
          if not resumen:
              raise SystemExit(0)
          with open(resumen, "a", encoding="utf-8") as f:
              f.write(f"## Cobertura del backend: {pct:.0f}%\n\n")
              f.write("### Servicios con menor cobertura\n\n")
              f.write("| Archivo | Cobertura |\n|---|---|\n")
              for valor, archivo in filas[:6]:
                  f.write(f"| `{archivo}` | {valor:.0f}% |\n")
          PY

      - name: Guardar el reporte HTML de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/htmlcov/
          retention-days: 14

  frontend:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        working-directory: frontend
        run: pnpm exec tsc -b --force

      - name: Compilar
        working-directory: frontend
        run: pnpm build

      - name: Auditar dependencias
        working-directory: frontend
        # Falla solo ante vulnerabilidades altas o criticas. Hoy queda
        # 1 'low' conocida (esbuild), sin correccion publicada aun.
        run: pnpm audit --audit-level high
