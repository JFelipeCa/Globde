# Configuracion de nginx para servir el build de PRODUCCION del frontend.
# Se usa por `frontend/Dockerfile.prod` (multi-stage: vite build -> nginx).
# El flujo de desarrollo (`frontend/Dockerfile`) no usa este archivo: sirve
# el dev server de Vite con proxy a /api.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy de la API. Dentro de la red de docker-compose el backend
    # se alcanza por el nombre de servicio `backend:8000`.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Headers de seguridad (OWASP / buenas practicas).
    # 'frame-ancestors self' permite embeber el sitio solo desde su propio
    # origen; ajustar si se sirve desde otro dominio.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP razonable: el build de Vite es de archivo unico (js/css inline),
    # por eso se permite 'unsafe-inline' en script/style. Las imagenes de
    # catalogo se sirven desde https (pexels) mientras se migran a assets.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
}
