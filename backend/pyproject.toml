[project]
name = "globde-api"
version = "2.0.0"
description = "API backend de Globde — gestion de barberia (FastAPI + MySQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    # Pinado exacto (norma del proyecto: nunca comodines). >=1.0.1 corrige
    # la CVE-2026-48710 ("BadHost"); 1.6.0 es la version resuelta actual.
    "starlette==1.6.0",
    "uvicorn[standard]==0.34.0",
    # >=1.2.2 corrige PYSEC-2026-2270 (set_key()/unset_key() seguian symlinks
    # al reescribir el .env, permitiendo sobrescribir archivos arbitrarios).
    "python-dotenv==1.2.2",
    "mysql-connector-python==9.1.0",
    "pydantic==2.10.4",
    "email-validator==2.2.0",
    "bcrypt==4.2.1",
    "PyJWT==2.13.0",
    # >=0.0.22 corrige la CVE-2026-24486 (escritura de archivo arbitraria via
    # traversal de nombre). El proyecto no usa UPLOAD_DIR ni Form/File, pero
    # se mantiene al dia para que la auditoria de dependencias quede limpia.
    "python-multipart==0.0.32",
    # Migraciones de base de datos. Va en dependencias de produccion
    # porque el despliegue ejecuta 'alembic upgrade head' antes de
    # arrancar la API. SQLAlchemy entra solo como motor de conexion de
    # Alembic: los services siguen usando mysql-connector directo.
    "alembic==1.19.1",
    "SQLAlchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    # Auditoria de dependencias del backend (par de `pnpm audit` en frontend).
    # Se corre en el CI: falla ante vulnerabilidades conocidas.
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
