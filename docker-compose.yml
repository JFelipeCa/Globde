services:

  backend:
    build: ./backend
    container_name: globde_backend
    restart: unless-stopped
    # El bridge de Codespaces bloquea DNS/SMTP saliente; host permite Gmail.
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      # Hora de Colombia (citas / datetime.now)
      TZ: ${TZ:-America/Bogota}

      # --- Base de datos TiDB Cloud (compartida) ---
      DB_HOST: ${DB_HOST:-gateway01.us-east-1.prod.aws.tidbcloud.com}
      DB_PORT: ${DB_PORT:-4000}
      DB_USER: ${DB_USER:-2zMf9kVKhzVziZp.root}
      DB_PASSWORD: ${DB_PASSWORD:-6mOEy2qqs8V4HAzk}
      DB_NAME: ${DB_NAME:-globde}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://2zMf9kVKhzVziZp.root:6mOEy2qqs8V4HAzk@gateway01.us-east-1.prod.aws.tidbcloud.com:4000/globde?ssl_verify_cert=true}

      # --- Correo (Gmail del grupo) ---
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-globde.2026@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-oekdtgitgzzwuzrf}
      SMTP_FROM: ${SMTP_FROM:-globde.2026@gmail.com}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15}
    volumes:
      - avatars_data:/app/media

  frontend:
    build: ./frontend
    container_name: globde_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      TZ: ${TZ:-America/Bogota}
      VITE_PROXY_TARGET: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - backend

volumes:
  avatars_data: