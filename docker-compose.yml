services:

  backend:
    build: ./backend
    container_name: globde_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
    # El bridge de Codespaces bloquea DNS/SMTP saliente; host permite Gmail.
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      # Hora de Colombia (citas / datetime.now)
      TZ: ${TZ:-America/Bogota}
      DB_HOST: "${DB_HOST:?Define DB_HOST en Codespaces Secrets o backend/.env}"
      DB_PORT: "${DB_PORT:-4000}"
      DB_USER: "${DB_USER:?Define DB_USER en Codespaces Secrets o backend/.env}"
      DB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en Codespaces Secrets o backend/.env}"
      DB_NAME: "${DB_NAME:-globde}"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-true}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:?Define SMTP_USER en Codespaces Secrets o backend/.env}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?Define SMTP_PASSWORD en Codespaces Secrets o backend/.env}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-15}"
    volumes:
      - avatars_data:/app/media

  frontend:
    build: ./frontend
    container_name: globde_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      TZ: ${TZ:-America/Bogota}
      VITE_PROXY_TARGET: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - backend

volumes:
  avatars_data: