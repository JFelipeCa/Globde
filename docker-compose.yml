services:

  backend:
    build: ./backend
    container_name: globde_backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
    # El bridge de Codespaces bloquea DNS/SMTP saliente; host permite Gmail.
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      # Hora de Colombia (citas / datetime.now)
      TZ: ${TZ:-America/Bogota}
    volumes:
      - avatars_data:/app/media

  frontend:
    build: ./frontend
    container_name: globde_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      TZ: ${TZ:-America/Bogota}
      VITE_PROXY_TARGET: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - backend

volumes:
  avatars_data: